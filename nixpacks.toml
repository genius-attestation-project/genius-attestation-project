providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
CI = "true"

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci --no-audit --no-fund && npm cache clean --force"]
cacheDirectories = []

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build && npm cache clean --force"
]

[start]
cmd = "npx prisma db push --skip-generate && npm start"